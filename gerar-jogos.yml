name: Atualizar lista de jogos
on:
  push:
    paths: ['jogos/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/gerar-jogos.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de jogos" && git push)
